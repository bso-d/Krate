# Kafbat serves its native login page and both configured sign-in buttons.
limit_req_zone $binary_remote_addr zone=krate_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=krate_identity:10m rate=10r/s;
# Identity requests are logged without query strings, which carry one-time codes.
log_format krate_identity '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';
# The proxy forwards the raw path; reject path forms that Keycloak could resolve
# outside the allowed prefix (dot segments, path parameters, encoded separators).
map $request_uri $krate_identity_unsafe_path {
    "~*^[^?]*(\.\.|;|%2e|%2f|%5c|\x5c)" 1;
    default 0;
}
# A path parameter (;, raw or encoded) is refused on every route. nginx normalises dot
# segments and percent-encoding before it matches a location, but not `;`, so
# /actuator;x/prometheus would pass the 404 prefixes below and rely on Spring's firewall
# default alone. Dot segments inside a name and encoded slashes stay allowed outside
# /identity/: Kafka topic names may contain `..` and Kafbat sends schema subjects
# path-encoded (it allows %2F on purpose).
map $request_uri $krate_path_parameter {
    "~*^[^?]*(;|%3b)" 1;
    default 0;
}
# This file is a template: the proxy image renders it into conf.d at start and
# substitutes the KRATE_PROXY_* environment variables only (NGINX_ENVSUBST_FILTER in Compose).
# KRATE_PROXY_PUBLIC_HOST is the Host header a browser sends for KEYCLOAK_PUBLIC_URL
# (its host, plus :port when the URL names one other than 443) in Keycloak sign-in mode
# (runtime.yml) and empty in local.yml mode; krate keeps it in .env. With a public
# host, a request whose raw Host header (port included) is any other value is closed
# without a response (444): $http_host is what the upstreams receive as Host and
# X-Forwarded-Host, so no client can make Kafbat build its redirect and logout URLs
# ({baseUrl}) from an authority of its choice, not even with an absolute request-URI
# (which sets $host from the request line while Host stays the client's). Without a
# public host (local.yml), every name is served.
map "$http_host ${KRATE_PROXY_PUBLIC_HOST}" $krate_foreign_host {
    "~*^(\S+) \1$" 0;
    "~ $" 0;
    default 1;
}
server {
    listen 80;
    server_name _;
    if ($krate_foreign_host) { return 444; }
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    if ($krate_foreign_host) { return 444; }
    if ($krate_path_parameter) { return 400; }
    resolver 127.0.0.11 valid=1s ipv6=off;
    # Resolve at request time, allowing the proxy to start before Kafbat.
    set $kafbat http://kafka-ui:8080;
    set $keycloak http://keycloak:8080;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
    proxy_connect_timeout 2s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    # The upstreams see only this proxy's forwarded headers: the client's Forwarded (RFC 7239),
    # X-Forwarded-Prefix, X-Forwarded-Ssl and X-Forwarded-Port are dropped. The client's port
    # (KAFKA_UI_HTTPS_PORT) travels in X-Forwarded-Host.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Port "";
    # Keep Kafbat's login page as the entry point; each button chooses its route.
    location = /login {
        access_log off;
        limit_req zone=krate_login burst=20 nodelay;
        proxy_pass $kafbat;
    }
    location /oauth2/ {
        access_log off;
        limit_req zone=krate_login burst=20 nodelay;
        proxy_pass $kafbat;
    }
    location /login/oauth2/ {
        access_log off;
        proxy_pass $kafbat;
    }
    # Expose only the krate realm and its page assets. The Keycloak admin console,
    # Admin REST API and master realm are not reachable through this proxy;
    # administer Keycloak from the host (see the SSO operator guide).
    location = /identity {
        return 404;
    }
    location ^~ /identity/ {
        access_log /var/log/nginx/access.log krate_identity;
        return 404;
    }
    location ^~ /identity/realms/krate/ {
        access_log /var/log/nginx/access.log krate_identity;
        limit_req zone=krate_identity burst=40 nodelay;
        if ($krate_identity_unsafe_path) { return 400; }
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        # The upstreams see only this proxy's forwarded headers: the client's Forwarded (RFC 7239),
        # X-Forwarded-Prefix, X-Forwarded-Ssl and X-Forwarded-Port are dropped. The client's port
        # (KAFKA_UI_HTTPS_PORT) travels in X-Forwarded-Host.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Port "";
    }
    location ^~ /identity/resources/ {
        access_log off;
        limit_except GET HEAD { deny all; }
        if ($krate_identity_unsafe_path) { return 400; }
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        # A location that sets any proxy_set_header loses the server-level ones: the client
        # address headers are restated so a caller's X-Forwarded-For never reaches Keycloak.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        # The upstreams see only this proxy's forwarded headers: the client's Forwarded (RFC 7239),
        # X-Forwarded-Prefix, X-Forwarded-Ssl and X-Forwarded-Port are dropped. The client's port
        # (KAFKA_UI_HTTPS_PORT) travels in X-Forwarded-Host.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Port "";
    }
    # Kafbat's unauthenticated Prometheus endpoint and Spring actuator, and the OIDC
    # back-channel logout endpoint Keycloak reaches over the identity network, are
    # not part of the public UI.
    # Prefixes without a trailing slash: the base paths themselves (/actuator is Spring's
    # unauthenticated endpoint discovery page, /logout/connect the back-channel root) must
    # not fall through to the catch-all location either.
    location ^~ /metrics {
        return 404;
    }
    location ^~ /actuator {
        return 404;
    }
    location ^~ /logout/connect {
        return 404;
    }
    location / {
        proxy_pass $kafbat;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        # The upstreams see only this proxy's forwarded headers: the client's Forwarded (RFC 7239),
        # X-Forwarded-Prefix, X-Forwarded-Ssl and X-Forwarded-Port are dropped. The client's port
        # (KAFKA_UI_HTTPS_PORT) travels in X-Forwarded-Host.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
