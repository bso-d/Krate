# Kafbat serves its native login page and both configured sign-in buttons.
limit_req_zone $binary_remote_addr zone=krate_login:10m rate=5r/s;
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    resolver 127.0.0.11 valid=1s ipv6=off;
    # Resolve at request time, allowing the proxy to start before Kafbat.
    set $kafbat http://kafka-ui:8080;
    set $keycloak http://keycloak:8080;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
    proxy_connect_timeout 2s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Keep Kafbat's login page as the entry point; each button chooses its route.
    location = /login {
        access_log off;
        limit_req zone=krate_login burst=20 nodelay;
        proxy_pass $kafbat;
    }
    location /oauth2/ {
        access_log off;
        limit_req zone=krate_login burst=20 nodelay;
        proxy_pass $kafbat;
    }
    location /login/oauth2/ {
        access_log off;
        proxy_pass $kafbat;
    }
    location = /identity {
        return 301 /identity/;
    }
    location ^~ /identity/ {
        access_log off;
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location / {
        proxy_pass $kafbat;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
