services:
  # ─── Brokers (KRaft combined mode: each node is broker + controller) ──────────
  #
  # CLUSTER_ID is a fixed base64-encoded UUID. All brokers in the same cluster
  # must share the same value. Do not change it after first startup — it is
  # embedded in on-disk storage. Regenerate only when starting fresh.
  #
  # Controller listener (290xx) is internal-only; not exposed to the host.
  # Quorum voters reference each node's controller port inside the docker network.
  #
  kafka-92:
    image: ${KAFKA_IMAGE}
    hostname: kafka-92
    container_name: krate-broker-92
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      CLUSTER_ID: "4GThRKJoQF2BmLyqAl4JlQ"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 92
      KAFKA_CONTROLLER_QUORUM_VOTERS: "92@kafka-92:29092,93@kafka-93:29093,94@kafka-94:29094,95@kafka-95:29095"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-92:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-92-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s

  kafka-93:
    image: ${KAFKA_IMAGE}
    hostname: kafka-93
    container_name: krate-broker-93
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "9093:9093"
      - "19093:19093"
    environment:
      CLUSTER_ID: "4GThRKJoQF2BmLyqAl4JlQ"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 93
      KAFKA_CONTROLLER_QUORUM_VOTERS: "92@kafka-92:29092,93@kafka-93:29093,94@kafka-94:29094,95@kafka-95:29095"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:19093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-93:9093,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-93-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9093 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s

  kafka-94:
    image: ${KAFKA_IMAGE}
    hostname: kafka-94
    container_name: krate-broker-94
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "9094:9094"
      - "19094:19094"
    environment:
      CLUSTER_ID: "4GThRKJoQF2BmLyqAl4JlQ"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 94
      KAFKA_CONTROLLER_QUORUM_VOTERS: "92@kafka-92:29092,93@kafka-93:29093,94@kafka-94:29094,95@kafka-95:29095"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:19094,CONTROLLER://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-94:9094,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-94-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9094 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s

  kafka-95:
    image: ${KAFKA_IMAGE}
    hostname: kafka-95
    container_name: krate-broker-95
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "9095:9095"
      - "19095:19095"
    environment:
      CLUSTER_ID: "4GThRKJoQF2BmLyqAl4JlQ"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 95
      KAFKA_CONTROLLER_QUORUM_VOTERS: "92@kafka-92:29092,93@kafka-93:29093,94@kafka-94:29094,95@kafka-95:29095"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9095,EXTERNAL://0.0.0.0:19095,CONTROLLER://0.0.0.0:29095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-95:9095,EXTERNAL://localhost:19095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-95-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9095 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─── Kafbat UI (internal only — access via nginx proxy on :8080) ─────────────
  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    hostname: kafka-ui
    container_name: krate-kafbat
    restart: unless-stopped
    depends_on:
      kafka-92:
        condition: service_healthy
      kafka-93:
        condition: service_healthy
      kafka-94:
        condition: service_healthy
      kafka-95:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/krate/auth/${KAFKA_UI_AUTH_CONFIG:-local.yml}
      JAVA_TOOL_OPTIONS: ${KAFKA_UI_JAVA_OPTS:-}
      # Offline runtime: disable startup/hourly requests to api.github.com.
      GITHUB_RELEASE_INFO_ENABLED: "false"
      # Honor X-Forwarded-* from the nginx TLS proxy so login redirects/cookies
      # use https (not the internal http://...:8080).
      SERVER_FORWARDHEADERSSTRATEGY: "framework"
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
      KEYCLOAK_KAFBAT_CLIENT_SECRET: ${KEYCLOAK_KAFBAT_CLIENT_SECRET}
      KAFKA_CLUSTERS_0_NAME: cluster-1-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-92:9092,kafka-93:9093,kafka-94:9094,kafka-95:9095"
      KAFKA_CLUSTERS_0_READONLY: "false"
    volumes:
      - ./auth/ui:/etc/krate/auth:ro,z
    networks:
      - kafka-network
      - identity
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Nginx TLS proxy (terminates HTTPS on :443, redirects :80 → :443) ───
  proxy:
    image: ${NGINX_IMAGE}
    container_name: krate-proxy
    restart: unless-stopped
    depends_on:
      kafka-ui:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_HTTP_PORT:-80}:80"
      - "${KAFKA_UI_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      kafka-network: {}
      # Fixed address: the one Keycloak trusts forwarded headers from
      # (KC_PROXY_TRUSTED_ADDRESSES). The Compose specification requires the
      # network to "have an `ipam` attribute with subnet configurations
      # covering each static address" (see networks below).
      identity:
        ipv4_address: ${KRATE_IDENTITY_PROXY_IP:-172.29.250.10}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak-db:
    profiles: [sso]
    image: ${KEYCLOAK_DB_IMAGE}
    restart: unless-stopped
    # Keycloak connects over TLS and verifies this server's certificate
    # (KC_DB_TLS_MODE=verify-server), so PostgreSQL needs the key and certificate
    # that `krate identity up` generates under auth/keycloak/db-tls/. The image's
    # entrypoint starts as root and drops to postgres, so this wrapper first gives
    # PostgreSQL private copies of the files: the bind-mounted directory keeps
    # the host owner and mode (0700), which the postgres user cannot traverse,
    # and PostgreSQL refuses a key that is not 0600 and owned by its user.
    # The generated pg_hba.conf allows the local socket (pg_isready) and TLS
    # connections with SCRAM; plaintext TCP connections are rejected.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for f in server.key server.crt ca.crt pg_hba.conf; do
          install -o postgres -g postgres -m 600 "/run/krate-db-tls/$$f" "/var/run/postgresql/$$f"
        done
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/run/postgresql/server.crt \
          -c ssl_key_file=/var/run/postgresql/server.key \
          -c ssl_ca_file=/var/run/postgresql/ca.crt \
          -c hba_file=/var/run/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
      - ./auth/keycloak/db-tls:/run/krate-db-tls:ro,z
    # Reachable only from the identity network (Keycloak, proxy, Kafbat).
    networks: [identity]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    profiles: [sso]
    image: ${KEYCLOAK_IMAGE}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Encrypt the database connection and verify keycloak-db's certificate
      # against the CA that `krate identity up` generated (PEM, as PostgreSQL
      # requires).
      KC_DB_TLS_MODE: verify-server
      KC_DB_TLS_TRUST_STORE_FILE: /opt/keycloak/conf/db-tls/ca.crt
      # No bootstrap admin here: `krate identity up` creates the master realm
      # and a temporary admin with `kc.sh bootstrap-admin user` before the first
      # start, replaces it with KEYCLOAK_ADMIN_USER and deletes it. (Keycloak
      # rejects an empty KC_BOOTSTRAP_ADMIN_USERNAME, so the variables cannot
      # be left in place for later starts.)
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      # Forwarded headers are accepted from the nginx proxy's fixed address on
      # the identity network only. Keycloak's reverse proxy guide: "To ensure
      # that proxy headers are used only from proxies you trust, set the
      # `proxy-trusted-addresses` option"; "Without this restriction, clients
      # could bypass the proxy and send forged forwarded headers directly to
      # Keycloak." The address must be the proxy's ipv4_address below.
      KC_PROXY_TRUSTED_ADDRESSES: ${KRATE_IDENTITY_PROXY_IP:-172.29.250.10}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
      KEYCLOAK_KAFBAT_CLIENT_SECRET: ${KEYCLOAK_KAFBAT_CLIENT_SECRET}
      PING_KEYCLOAK_CLIENT_SECRET: ${PING_KEYCLOAK_CLIENT_SECRET}
      # Service-account client used by `krate identity users`; the realm import
      # substitutes the placeholder of the same name in krate-realm.json.
      KEYCLOAK_CLI_CLIENT_SECRET: ${KEYCLOAK_CLI_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "bash", "-ec", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ./auth/keycloak/krate-realm.json:/opt/keycloak/data/import/krate-realm.json:ro,z
      - ./auth/keycloak/truststores:/opt/keycloak/conf/truststores:ro,z
      - ./auth/keycloak/db-tls/ca.crt:/opt/keycloak/conf/db-tls/ca.crt:ro,z
    # identity: the database, the proxy and Kafbat. identity-egress: Keycloak's
    # own route out of the host for the Phase 3 identity provider (an internal
    # network has no such route); nothing else joins it. Not on kafka-network.
    networks: [identity, identity-egress]

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  kafka-92-data:
  kafka-93-data:
  kafka-94-data:
  kafka-95-data:
  keycloak_db_data:

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  kafka-network:
    driver: bridge
  # Keycloak, its database, the proxy and Kafbat only. `internal: true` "lets
  # you create an externally isolated network" (Compose specification): no
  # route to the host or outside, and nothing from the monitoring project. The
  # fixed subnet lets the proxy keep the static address Keycloak trusts; change
  # KRATE_IDENTITY_SUBNET and KRATE_IDENTITY_PROXY_IP together in .env when the
  # range is in use on this host (`krate identity up` checks for a clash).
  identity:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${KRATE_IDENTITY_SUBNET:-172.29.250.0/24}
  # Keycloak's egress for the Phase 3 identity provider; no other service.
  identity-egress:
    driver: bridge
