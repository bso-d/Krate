# Kafka EXTERNAL TCP passthrough (TLS/SASL terminates at the brokers).
# Resolve broker container names dynamically via Docker's embedded DNS so a
# recreated broker with a new IP on kafka-network is picked up within 1s.
resolver 127.0.0.11 valid=1s ipv6=off;

map $server_port $krate_kafka_upstream {
    19092 kafka-92:19092;
    19093 kafka-93:19093;
    19094 kafka-94:19094;
    19095 kafka-95:19095;
}

server {
    listen 19092;
    listen 19093;
    listen 19094;
    listen 19095;

    proxy_pass $krate_kafka_upstream;
    proxy_connect_timeout 5s;
    # Exceeds Kafka's connections.max.idle.ms (9m default) so idle/paused
    # consumers receive clean broker closes rather than proxy TCP resets.
    proxy_timeout 1h;
}
