# __NAME__: logrotate rules for the Krate identity journal, rendered and
# installed by `krate identity logrotate --install`. The journal is written
# append-only by krate; copytruncate rotates it without a reopen.
__JOURNAL__ {
    monthly
    rotate 12
    maxage 400
    copytruncate
    missingok
    notifempty
    compress
    delaycompress
}
