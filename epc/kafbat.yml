# Kafbat's cluster list: add one entry per independent Kafka cluster.
# These placeholders are resolved by Kafbat from its container environment.
kafka:
  clusters:
    - name: "${KAFKA_UI_CLUSTER_NAME:cluster-epc}"
      bootstrapServers: kafka-92:19092,kafka-93:19093
      readOnly: "${KAFKA_UI_READONLY:false}"
      properties:
        security.protocol: "${KAFKA_UI_SECURITY_PROTOCOL:PLAINTEXT}"
        sasl.mechanism: "${KAFKA_UI_SASL_MECHANISM:PLAIN}"
        sasl.jaas.config: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="krate-ui-kafka" clientSecret="${KEYCLOAK_KAFBAT_KAFKA_CLIENT_SECRET:}" scope="kafka";'
        sasl.login.callback.handler.class: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
        sasl.oauthbearer.token.endpoint.url: "${KAFKA_UI_OAUTH_TOKEN_URL:http://keycloak:8080/identity/realms/krate/protocol/openid-connect/token}"

    # Uncomment and replace the example domain with the real broker FQDN.
    # Both ports must be reachable from this Kafbat container. These are Kafka
    # broker ports, not the remote UI's HTTPS port. Add further entries as needed.
    # - name: epc-appkfk-02
    #   bootstrapServers: epc-appkfk-02.example.internal:9092,epc-appkfk-02.example.internal:9093
    #   readOnly: true
