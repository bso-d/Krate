[SERVICE]
    Flush                     1
    Grace                     30
    Log_Level                 warn
    Parsers_File              /fluent-bit/etc/parsers.conf
    Parsers_File              /etc/krate/fluent-bit/parsers-multiline.conf
    storage.path              /state/chunks
    storage.sync              full
    storage.checksum          on
    storage.max_chunks_up     64
    storage.backlog.mem_limit  16M

[INPUT]
    Name                      tail
    Path                      /sources/*/*-json.log
    Path_Key                  filepath
    Tag                       container.*
    DB                        /state/tail.db
    DB.sync                   full
    DB.locking                true
    DB.compare_filename       true
    Read_from_Head            true
    Refresh_Interval          5
    Rotate_Wait               30
    Buffer_Chunk_Size         64K
    Buffer_Max_Size           2M
    Skip_Long_Lines           off
    multiline.parser          docker
    storage.type              filesystem

# This must be the first filter: completed records re-enter the pipeline.
[FILTER]
    Name                      multiline
    Match                     container.*
    multiline.key_content     log
    multiline.parser          krate_java
    buffer                    on
    flush_ms                  2000
    emitter_storage.type      filesystem
    emitter_mem_buf_limit     16M

[FILTER]
    Name                      lua
    Match                     container.*
    script                    /etc/krate/fluent-bit/metadata.lua
    call                      enrich
    time_as_table             true

[OUTPUT]
    Name                      loki
    Match                     container.*
    Host                      loki
    Port                      3100
    Labels                    job=containerlogs,container=$container,container_id=$container_id,stream=$stream
    Remove_Keys               filepath,container,container_id,stream,time
    Line_Format               json
    Drop_Single_Key           raw
    Retry_Limit               no_limits
    storage.total_limit_size  1G

# Parallel copy for VictoriaLogs (Perses logs). Its own bounded filesystem
# queue keeps Loki delivery independent when VictoriaLogs is unavailable.
# disable_message_parsing keeps the exact Loki message text.
[OUTPUT]
    Name                      loki
    Match                     container.*
    Host                      victorialogs
    Port                      9428
    URI                       /insert/loki/api/v1/push?disable_message_parsing=1
    Labels                    job=containerlogs,container=$container,container_id=$container_id,stream=$stream
    Remove_Keys               filepath,container,container_id,stream,time
    Line_Format               json
    Drop_Single_Key           raw
    Retry_Limit               no_limits
    storage.total_limit_size  1G
