# Discover only Krate/EPC containers and read their json-file logs.
# Docker socket access is required for discovery; positions survive restarts.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/${KRATE_LOG_PATTERN}'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - target_label: job
        replacement: containerlogs
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 168h
          drop_counter_reason: older_than_retention
