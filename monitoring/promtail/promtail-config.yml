# Ships Docker container logs to Loki.
#
# Reads the json-file logs directly off the host rather than using the Docker
# service-discovery API, so it keeps working if the socket is unavailable. On
# Docker Desktop for macOS these paths live inside the VM and nothing useful is
# collected — Linux hosts are the supported target.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      # The container id is the parent directory; resolve it to a name below.
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.*'
      - labels:
          stream:
          container_id:
      # On first start promtail reads existing log files from the beginning,
      # including containers that stopped weeks ago. Loki rejects anything older
      # than its reject_old_samples_max_age with a 400, so drop them here instead
      # of shipping batches that are guaranteed to fail.
      - drop:
          older_than: 168h
          drop_counter_reason: older_than_retention
      - output:
          source: output

    # Keep only Krate's own containers; a shared host may run plenty else.
    relabel_configs:
      - source_labels: [__path__]
        regex: '.*'
        target_label: host
        replacement: '${HOSTNAME}'
