apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # fixed uid so provisioned dashboards bind to it
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    # Through the read-only gateway: Loki has no authentication, and a direct URL
    # would let any Grafana user who can reach a datasource write to it.
    url: http://loki-gateway:3100
    editable: false
