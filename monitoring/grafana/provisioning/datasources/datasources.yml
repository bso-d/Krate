apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # fixed uid so provisioned dashboards bind to it
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
