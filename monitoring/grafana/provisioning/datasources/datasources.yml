apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # fixed uid so provisioned dashboards bind to it
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    # Through the read-only gateway: Loki has no authentication, and a direct URL
    # would let any Grafana user who can reach a datasource write to it.
    url: http://loki-gateway:3100
    editable: false
    jsonData:
      # Krate's alert rules are seeded into Grafana against Prometheus
      # (monitoring/seed-alerting.py); Loki-managed rules are not used. Without this,
      # Grafana's Alerting list asks Loki for its rules (manageAlerts defaults to true
      # when jsonData is unset, v12.2.0 datasource.ts:345) and the read-only gateway
      # answers 403, which the UI reports as a datasource error.
      manageAlerts: false
