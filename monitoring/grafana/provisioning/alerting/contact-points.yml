apiVersion: 1

# A default email contact point so alerting is wired the moment SMTP is turned
# on. The address comes from ALERT_EMAIL_TO. Operators change recipients and
# choose which rules notify from the Grafana UI — no redeploy, which is the
# whole reason alerting lives in Grafana rather than a standalone Alertmanager.
#
# This resource is NOT marked non-editable: the UI must be able to change it.
contactPoints:
  - orgId: 1
    name: krate-email
    receivers:
      - uid: krate-email-default
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: false

policies:
  - orgId: 1
    receiver: krate-email
    group_by: [alertname, consumergroup, mountpoint]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
