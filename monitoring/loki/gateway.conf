# Read-only gateway in front of Loki, for Grafana's Loki datasource (uid `loki`).
#
# Loki "does not come with any included authentication layer", so whoever reaches
# it can also write to it: with the datasource pointed at loki:3100 directly, a
# Grafana Viewer could push log lines, delete series, and flush or shut the
# ingester down through Grafana's datasource proxy (harness/phase4/lab1 G-f).
# Only Loki's query API is forwarded here; every other path, /config and the
# write and lifecycle endpoints included, is refused with 403.
#
# Fluent Bit keeps writing to loki:3100 directly, so the log write path never
# passes this gateway.
server {
    listen 3100;
    server_name _;
    access_log /var/log/nginx/access.log;
    client_max_body_size 1m;
    location ~ ^/loki/api/v1/(query|query_range|labels|series|index/stats|index/volume|index/volume_range|detected_fields|detected_labels|patterns)$ {
        limit_except GET POST { deny all; }
        proxy_pass http://loki:3100;
    }
    location ~ ^/loki/api/v1/label/[^/]+/values$ {
        limit_except GET { deny all; }
        proxy_pass http://loki:3100;
    }
    # The per-field counterpart of the label-values read, which Grafana's Loki
    # LanguageProvider calls (Loki v3.5.0 modules.go:1368, LanguageProvider.ts:329).
    location ~ ^/loki/api/v1/detected_field/[^/]+/values$ {
        limit_except GET POST { deny all; }
        proxy_pass http://loki:3100;
    }
    # Grafana's Live tail upgrades this one path to a WebSocket.
    location = /loki/api/v1/tail {
        limit_except GET { deny all; }
        proxy_pass http://loki:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location = /ready {
        limit_except GET { deny all; }
        proxy_pass http://loki:3100;
    }
    location / {
        return 403;
    }
}
