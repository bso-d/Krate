# Krate observability — metrics, logs and alerting for whichever variant is running.
#
# Shared by every variant. `krate monitor up` discovers the cluster's network and
# broker list at runtime and passes them in, so this file is not variant-specific.
#
# Requires the cluster to be up first: the exporter joins its network to reach
# the brokers by name.

networks:
  kafka-network:
    external: true
    name: ${KAFKA_NETWORK}
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  fluent_bit_state:
  fluent_bit_sources:
  victorialogs_data:
  alertmanager_data:
  perses_data:
  perses_seed_state:
  perses_sync_state:
  # Per-install configuration rendered by monitoring-init, one per consumer.
  perses_rendered:
  gateway_rendered:
  alertmanager_rendered:
  oauth2_proxy_rendered:
  perses_sync_rendered:

services:
  # ── kafka-exporter — cluster/topic/consumer-group metrics as a Kafka client ──
  # Connects over the brokers' PLAINTEXT listener; no JMX agent, no broker restart.
  kafka-exporter:
    image: ${KAFKA_EXPORTER_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-kafka-exporter
    restart: unless-stopped
    command: --web.listen-address=:9308 ${KAFKA_EXPORTER_TARGETS}
    networks: [kafka-network, monitoring]
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── node-exporter — host disk/CPU/memory ────────────────────────────────────
  # Kafka metrics say nothing about the disk the logs sit on. This is what backs
  # the disk-capacity alerts, which matter most where broker data shares one volume.
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-node-exporter
    restart: unless-stopped
    # Mount procfs/sysfs/rootfs separately rather than `/:/host:ro,rslave`.
    # rslave propagation is rejected where / is neither shared nor slave (Docker
    # Desktop, and some Linux hosts), which aborts the whole stack. This pattern
    # works on both; the tradeoff is that mounts created after the container
    # starts are not picked up, which does not affect a boot-time /data mount.
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run|host)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Prometheus — metric storage + alert-rule evaluation ─────────────────────
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-prometheus
    restart: unless-stopped
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,z
      - prometheus_data:/prometheus
    environment:
      KAFKA_EXPECTED_BROKERS: ${KAFKA_EXPECTED_BROKERS:?Set the configured broker count}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${KAFKA_EXPECTED_BROKERS}" in
          ''|*[!0-9]*) echo 'KAFKA_EXPECTED_BROKERS must be a positive integer' >&2; exit 1 ;;
        esac
        [ "$${KAFKA_EXPECTED_BROKERS}" -gt 0 ] || { echo 'KAFKA_EXPECTED_BROKERS must be positive' >&2; exit 1; }
        printf 'groups:\n  - name: krate-topology\n    rules:\n      - record: kafka_expected_brokers\n        expr: vector(%s)\n' "$${KAFKA_EXPECTED_BROKERS}" > /tmp/krate-topology.yml
        exec /bin/prometheus "$$@"
      - prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    networks: [monitoring]
    depends_on: [kafka-exporter]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Loki — log storage ──────────────────────────────────────────────────────
  loki:
    image: ${LOKI_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Metadata-only discovery admits selected files before Fluent Bit tails them.
  log-discovery:
    image: ${LOG_DISCOVERY_IMAGE:?Merge LOG_DISCOVERY_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-log-discovery
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/krate:size=64k,mode=0700,noexec,nosuid,nodev
    volumes:
      - ./fluent-bit:/etc/krate/fluent-bit:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_sources:/sources
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      KRATE_EXCLUDED_CONTAINERS: ${MONITOR_PROJECT:-krate-monitoring}-fluent-bit,${MONITOR_PROJECT:-krate-monitoring}-log-discovery
    command: ["python3", "/etc/krate/fluent-bit/discovery.py"]
    healthcheck:
      test: ["CMD", "python3", "/etc/krate/fluent-bit/discovery.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Fluent Bit — ships selected container logs to Loki ─────────────────────
  # Read-only Docker metadata supplies names; no Docker API socket is mounted.
  fluent-bit:
    image: ${FLUENT_BIT_IMAGE:?Merge FLUENT_BIT_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-fluent-bit
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./fluent-bit:/etc/krate/fluent-bit:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_state:/state
      - fluent_bit_sources:/sources:ro
    environment:
      KRATE_COLLECTOR_CONTAINER: ${MONITOR_PROJECT:-krate-monitoring}-fluent-bit
      KRATE_DISCOVERY_CONTAINER: ${MONITOR_PROJECT:-krate-monitoring}-log-discovery
    command: ["-c", "/etc/krate/fluent-bit/fluent-bit.conf"]
    networks: [monitoring]
    depends_on:
      loki:
        condition: service_started
      log-discovery:
        condition: service_healthy
      victorialogs:
        condition: service_started
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Grafana — dashboards + alerting UI ──────────────────────────────────────
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - ./auth:/etc/krate/auth:ro,z
    environment:
      GF_PATHS_CONFIG: /etc/krate/auth/${GRAFANA_AUTH_CONFIG:-local.ini}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # SMTP is opt-in. With it disabled the rules still fire and are visible in
      # the UI; only delivery is off, so the stack stays fully offline-capable.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-krate-alerts@example.com}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Krate}
      GF_SMTP_SKIP_VERIFY: ${GF_SMTP_SKIP_VERIFY:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ops@example.com}
    networks: [monitoring]
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Parallel alternative: Perses + VictoriaLogs + Alertmanager ─────────────
  # Runs beside Grafana/Loki. Perses is served over HTTPS on PERSES_PORT.

  # Renders mode-dependent configuration and secrets into the volumes of the
  # services that read them, then exits.
  monitoring-init:
    image: ${LOG_DISCOVERY_IMAGE:?Merge LOG_DISCOVERY_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-init
    restart: "no"
    mem_limit: 64m
    cpus: 0.2
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./render.py:/etc/krate/monitoring/render.py:ro,z
      - ./auth/perses:/etc/krate/site:ro,z
      - perses_rendered:/rendered/perses
      - gateway_rendered:/rendered/gateway
      - alertmanager_rendered:/rendered/alertmanager
      - oauth2_proxy_rendered:/rendered/oauth2-proxy
      - perses_sync_rendered:/rendered/perses-sync
      - perses_sync_state:/rendered/state/perses-sync
      - perses_seed_state:/rendered/state/perses-seed
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
      PYTHONDONTWRITEBYTECODE: "1"
      PERSES_AUTH_MODE: ${PERSES_AUTH_MODE:-local}
      PERSES_PORT: ${PERSES_PORT:-3443}
      PERSES_ADMIN_USER: ${PERSES_ADMIN_USER:-admin}
      PERSES_ADMIN_PASSWORD: ${PERSES_ADMIN_PASSWORD:-}
      PERSES_ENCRYPTION_KEY: ${PERSES_ENCRYPTION_KEY:-}
      PERSES_SYNC_CLIENT_SECRET: ${PERSES_SYNC_CLIENT_SECRET:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-krate-alerts@example.com}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Krate}
      GF_SMTP_SKIP_VERIFY: ${GF_SMTP_SKIP_VERIFY:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ops@example.com}
      ALERTMANAGER_EMAIL_ENABLED: ${ALERTMANAGER_EMAIL_ENABLED:-}
      ALERTMANAGER_SMTP_REQUIRE_TLS: ${ALERTMANAGER_SMTP_REQUIRE_TLS:-true}
    command: ["python3", "/etc/krate/monitoring/render.py", "/rendered", "/etc/krate/site/perses.json"]
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # ── VictoriaLogs — parallel log store queried by Perses ────────────────────
  victorialogs:
    image: ${VICTORIALOGS_IMAGE:?Merge VICTORIALOGS_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-victorialogs
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${VICTORIALOGS_RETENTION:-7d}
      - -httpListenAddr=:9428
    volumes:
      - victorialogs_data:/victoria-logs-data
    networks: [monitoring]
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Alertmanager — routes Prometheus alerts to email ───────────────────────
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?Merge ALERTMANAGER_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    command:
      - --config.file=/etc/alertmanager/rendered/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.listen-address=:9093
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
    volumes:
      - alertmanager_rendered:/etc/alertmanager/rendered:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Perses — dashboards for Prometheus metrics and VictoriaLogs logs ───────
  # No host port: reachable only through perses-gateway.
  perses:
    image: ${PERSES_IMAGE:?Merge PERSES_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-perses
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["--config=/etc/krate/perses/rendered/config.yaml", "--log.level=warning"]
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
    volumes:
      - perses_data:/perses
      - ./perses/provisioning:/etc/krate/perses/provisioning:ro,z
      - perses_rendered:/etc/krate/perses/rendered:ro
    networks: [monitoring]
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # Seeds the shipped dashboards, keeping UI edits until a file changes.
  perses-seed:
    image: ${LOG_DISCOVERY_IMAGE:?Merge LOG_DISCOVERY_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-perses-seed
    restart: "no"
    user: "65534:65534"
    mem_limit: 64m
    cpus: 0.2
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./perses/seed.py:/etc/krate/perses/seed.py:ro,z
      - ./perses/dashboards:/etc/krate/perses/dashboards:ro,z
      - ./auth/perses:/etc/krate/site:ro,z
      - perses_seed_state:/var/lib/krate-perses-seed
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
      PYTHONDONTWRITEBYTECODE: "1"
      PERSES_AUTH_MODE: ${PERSES_AUTH_MODE:-local}
      PERSES_ADMIN_USER: ${PERSES_ADMIN_USER:-admin}
      PERSES_ADMIN_PASSWORD: ${PERSES_ADMIN_PASSWORD:-}
      PERSES_SYNC_CLIENT_SECRET: ${PERSES_SYNC_CLIENT_SECRET:-}
    command: ["python3", "/etc/krate/perses/seed.py"]
    networks: [monitoring]
    depends_on:
      perses:
        condition: service_started
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # HTTPS entry point. In local mode it proxies to Perses' own login; with
  # SSO every request is checked by perses-sync against the IdP session.
  perses-gateway:
    image: ${NGINX_IMAGE:?Merge NGINX_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-perses-gateway
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    ports:
      - "${PERSES_PORT:-3443}:3443"
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
    volumes:
      - gateway_rendered:/etc/nginx/conf.d:ro
      - ./perses/gateway:/etc/krate/perses-gateway:ro,z
      # krate monitor up sets the cluster's certificate directory.
      - ${PERSES_CERTS_DIR:-../certs}:/etc/nginx/certs:ro,z
    networks: [monitoring]
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      perses:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  oauth2-proxy:
    profiles: [perses-sso]
    image: ${OAUTH2_PROXY_IMAGE:?Merge OAUTH2_PROXY_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-oauth2-proxy
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    volumes:
      - oauth2_proxy_rendered:/etc/oauth2-proxy:ro
    networks: [monitoring]
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # Maps current IdP groups to Perses roles and guards every request.
  perses-sync:
    profiles: [perses-sso]
    image: ${LOG_DISCOVERY_IMAGE:?Merge LOG_DISCOVERY_IMAGE from monitoring/.env.template into .env}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-perses-sync
    restart: unless-stopped
    user: "65534:65534"
    mem_limit: 96m
    cpus: 0.3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./perses/sync:/etc/krate/perses-sync/app:ro,z
      - perses_sync_rendered:/etc/krate/perses-sync/rendered:ro
      - perses_sync_state:/var/lib/krate-perses-sync
    environment:
      KRATE_RENDER_REVISION: ${KRATE_RENDER_REVISION:-}
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python3", "/etc/krate/perses-sync/app/perses_sync.py", "--config", "/etc/krate/perses-sync/rendered/config.json"]
    networks: [monitoring]
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      perses:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9091/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
