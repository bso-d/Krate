# Krate observability — metrics, logs and alerting for whichever variant is running.
#
# Shared by every variant. `krate monitor up` discovers the cluster's network and
# broker list at runtime and passes them in, so this file is not variant-specific.
#
# Requires the cluster to be up first: the exporter joins its network to reach
# the brokers by name.

networks:
  kafka-network:
    external: true
    name: ${KAFKA_NETWORK}
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  fluent_bit_state:

services:
  # ── kafka-exporter — cluster/topic/consumer-group metrics as a Kafka client ──
  # Connects over the brokers' PLAINTEXT listener; no JMX agent, no broker restart.
  kafka-exporter:
    image: ${KAFKA_EXPORTER_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-kafka-exporter
    restart: unless-stopped
    command: --web.listen-address=:9308 ${KAFKA_EXPORTER_TARGETS}
    networks: [kafka-network, monitoring]
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }

  # ── node-exporter — host disk/CPU/memory ────────────────────────────────────
  # Kafka metrics say nothing about the disk the logs sit on. This is what backs
  # the disk-capacity alerts, which matter most where broker data shares one volume.
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-node-exporter
    restart: unless-stopped
    # Mount procfs/sysfs/rootfs separately rather than `/:/host:ro,rslave`.
    # rslave propagation is rejected where / is neither shared nor slave (Docker
    # Desktop, and some Linux hosts), which aborts the whole stack. This pattern
    # works on both; the tradeoff is that mounts created after the container
    # starts are not picked up, which does not affect a boot-time /data mount.
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run|host)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Prometheus — metric storage + alert-rule evaluation ─────────────────────
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-prometheus
    restart: unless-stopped
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,z
      - prometheus_data:/prometheus
    environment:
      KAFKA_EXPECTED_BROKERS: ${KAFKA_EXPECTED_BROKERS:?Set the configured broker count}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${KAFKA_EXPECTED_BROKERS}" in
          ''|*[!0-9]*) echo 'KAFKA_EXPECTED_BROKERS must be a positive integer' >&2; exit 1 ;;
        esac
        [ "$${KAFKA_EXPECTED_BROKERS}" -gt 0 ] || { echo 'KAFKA_EXPECTED_BROKERS must be positive' >&2; exit 1; }
        printf 'groups:\n  - name: krate-topology\n    rules:\n      - record: kafka_expected_brokers\n        expr: vector(%s)\n' "$${KAFKA_EXPECTED_BROKERS}" > /tmp/krate-topology.yml
        exec /bin/prometheus "$$@"
      - prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    networks: [monitoring]
    depends_on: [kafka-exporter]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Loki — log storage ──────────────────────────────────────────────────────
  loki:
    image: ${LOKI_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Fluent Bit — ships container logs to Loki ──────────────────────────────
  # Read-only Docker metadata supplies names; no Docker API socket is mounted.
  fluent-bit:
    image: ${FLUENT_BIT_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-fluent-bit
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./fluent-bit:/etc/krate/fluent-bit:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_state:/state
    environment:
      KRATE_COLLECTOR_CONTAINER: ${MONITOR_PROJECT:-krate-monitoring}-fluent-bit
    command: ["-c", "/etc/krate/fluent-bit/fluent-bit.conf"]
    networks: [monitoring]
    depends_on: [loki]
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

  # ── Grafana — dashboards + alerting UI ──────────────────────────────────────
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: ${MONITOR_PROJECT:-krate-monitoring}-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - ./auth:/etc/krate/auth:ro,z
    environment:
      GF_PATHS_CONFIG: /etc/krate/auth/${GRAFANA_AUTH_CONFIG:-local.ini}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # SMTP is opt-in. With it disabled the rules still fire and are visible in
      # the UI; only delivery is off, so the stack stays fully offline-capable.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-krate-alerts@example.com}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Krate}
      GF_SMTP_SKIP_VERIFY: ${GF_SMTP_SKIP_VERIFY:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ops@example.com}
    networks: [monitoring]
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
