name: Release broker images

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Broker edition
        required: true
        type: choice
        options: [kraft, zk]
      version:
        description: 'Version for the new tag, for example v1.0.2 (a new version, not the vN.N.N pattern)'
        required: true
        type: string
  push:
    tags: ['kraft-v*', 'zk-v*']

permissions:
  contents: read

concurrency:
  group: broker-release-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.edition, inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      edition: ${{ steps.release.outputs.edition }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and source
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.edition, inputs.version) || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(kraft|zk)-(v[0-9]+(\.[0-9]+){0,2})$ ]] || {
            echo "Invalid release tag '$RELEASE_TAG'. Enter a real version, for example v1.0.2." >&2
            echo 'Tags must be kraft-vN[.N[.N]] or zk-vN[.N[.N]]. Latest existing tags:' >&2
            for prefix in kraft zk; do
              latest="$(git tag -l "$prefix-v*" --sort=-v:refname | head -1)"
              echo "  ${latest:-$prefix: none}" >&2
            done
            exit 1
          }
          edition="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || {
              echo 'Manual releases must run from main' >&2
              exit 1
            }
            git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > existing-tag.txt
            [[ ! -s existing-tag.txt ]] || {
              echo 'Manual releases require a new tag' >&2
              exit 1
            }
          fi
          gh api --paginate "repos/$REPOSITORY/releases" --jq '.[].tag_name' > existing-releases.txt
          if grep -Fxq "$RELEASE_TAG" existing-releases.txt; then
            echo 'An existing release cannot be republished' >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Release commits must already be merged into main' >&2
            exit 1
          }
          printf 'edition=%s\nversion=%s\nimage=ghcr.io/%s-%s\n' \
            "$edition" "$version" "${REPOSITORY,,}" "$edition" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    uses: ./.github/workflows/broker-ci.yml
    with:
      edition: ${{ needs.metadata.outputs.edition }}
      source_sha: ${{ needs.metadata.outputs.sha }}

  tag:
    needs: [metadata, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"

  publish:
    needs: [metadata, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [release, debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ needs.metadata.outputs.edition }}/Dockerfile
          target: ${{ matrix.flavor }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}-${{ matrix.flavor }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Record published digest
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          FLAVOR: ${{ matrix.flavor }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s:%s-%s\n%s@%s\n' "$IMAGE" "$VERSION" "$FLAVOR" "$IMAGE" "$DIGEST" > "${FLAVOR}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.flavor }}
          path: ${{ matrix.flavor }}.txt
          retention-days: 7

  release:
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Download image references
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Create edition release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          EDITION: ${{ needs.metadata.outputs.edition }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          monitor_dir=monitoring
          if [[ "$EDITION" == zk ]]; then monitor_dir=zk/monitoring; fi
          awk -F= '/^[A-Z_]+_IMAGE=/{print $2}' "$EDITION/.env.template" "$monitor_dir/.env.template" > dependencies.txt
          {
            printf 'Krate %s broker container images %s on GHCR (linux/amd64 and linux/arm64). This is not an offline install package; those are released as package-<edition>-vN.\n\n' "$EDITION" "$VERSION"
            printf 'Release image:\n\n'
            sed 's/^/    /' release.txt
            printf '\nDebug image:\n\n'
            sed 's/^/    /' debug.txt
            printf '\nDependency digests are recorded in dependencies.txt.\n'
            printf '\nDebug adds network and process diagnostic tools; both targets retain upstream broker startup.\n'
          } > release-notes.md
          gh release create "$RELEASE_TAG" release.txt debug.txt dependencies.txt \
            --verify-tag --latest=false --title "Broker images · $EDITION $VERSION" --notes-file release-notes.md
