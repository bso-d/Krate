name: Release offline install packages

# Offline install packages (brokers, SSO UI, Keycloak, PostgreSQL, monitoring
# and optional Docker packages, as one tarball per processor) are released as
# package-kraft-vN or package-epc-vN, titled "Offline install package".
# Broker image releases (broker-release.yml) use kraft-v*/zk-v* tags and are
# titled "Broker images"; the package- prefix never matches those triggers.
# The build itself is scripts/package-release.sh; run it locally first.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition
        required: true
        type: choice
        options: [kraft, epc]
      version:
        description: 'Package version for the new tag, for example v2 (a new version, not the vN pattern)'
        required: true
        type: string
      arch:
        description: Target processor
        required: true
        type: choice
        default: amd64
        options: [amd64, arm64, both]
      target_os:
        description: 'Docker packages to include (auto: kraft=noble, epc=rhel9)'
        required: true
        type: choice
        default: auto
        options: [auto, none, noble, jammy, rhel9]

permissions:
  contents: read

concurrency:
  group: package-release-${{ inputs.edition }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      arches: ${{ steps.release.outputs.arches }}
    steps:
      - name: Validate release tag and source
        id: release
        env:
          EDITION: ${{ inputs.edition }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.arch }}
          TARGET_OS: ${{ inputs.target_os }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Enter a real version in the form vN, for example v2." >&2
            latest="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/package-$EDITION-v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | sort -V | tail -1)"
            echo "Latest package-$EDITION tag: ${latest:-none}" >&2
            exit 1
          fi
          case "$EDITION/$TARGET_OS" in
            */auto|*/none|kraft/noble|kraft/jammy|epc/rhel9) ;;
            *) echo "Docker packages for $TARGET_OS do not apply to $EDITION" >&2; exit 1 ;;
          esac
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Releases must run from main' >&2; exit 1; }
          tag="package-$EDITION-$VERSION"
          # EPC packages were released as epc-vN before this workflow existed.
          tags=("$tag")
          [[ "$EDITION" != epc ]] || tags+=("epc-$VERSION")
          gh api --paginate "repos/$REPOSITORY/releases" --jq '.[] | select(.draft | not) | .tag_name' > published-releases.txt
          for candidate in "${tags[@]}"; do
            ! grep -Fxq "$candidate" published-releases.txt || { echo "Release $candidate is already published" >&2; exit 1; }
            tag_sha="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/$candidate" \
              --jq ".[] | select(.ref == \"refs/tags/$candidate\") | .object.sha")"
            [[ -n "$tag_sha" ]] || continue
            # A failed earlier run may have left the package tag on this commit;
            # the release job resumes it. Any other existing tag is refused.
            if [[ "$candidate" != "$tag" || "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $candidate already exists" >&2
              exit 1
            fi
            echo "Resuming unpublished $tag on $GITHUB_SHA"
          done
          arches='["amd64"]'
          [[ "$ARCH" != arm64 ]] || arches='["arm64"]'
          [[ "$ARCH" != both ]] || arches='["amd64","arm64"]'
          printf 'tag=%s\narches=%s\n' "$tag" "$arches" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: ${{ inputs.edition }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # The package step also downloads and verifies the corresponding source of every
    # copyleft component in the images (scripts/collect-sources.py, LICENSE-SOURCES.md).
    timeout-minutes: 180
    # The build runs third-party npm, Jest and Vite code from the pinned Kafbat
    # source. Keep it read-only, check out only the dispatched main commit, leave
    # no token in .git/config, and use no Actions cache.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(needs.metadata.outputs.arches) }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in a release build (see the cache note above).
          package-manager-cache: false
      # The corresponding-source step reads Go build info and downloads Go modules
      # (scripts/collect-sources.py). The arm64 runner image has no Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Validate source
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make check
      - name: Build package
        env:
          EDITION: ${{ inputs.edition }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET_OS: ${{ inputs.target_os }}
        run: scripts/package-release.sh "$EDITION" "$VERSION" "$ARCH" "$TARGET_OS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/release/${{ needs.metadata.outputs.tag }}/
          compression-level: 0
          retention-days: 1

  release:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true
      - name: Create or resume tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          EDITION: ${{ inputs.edition }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd release
          for checksum in ./*.tar.gz.sha256; do sha256sum -c "$checksum"; done
          # Corresponding-source archives: one tar per package, or .partNNN pieces when
          # the tar would exceed GitHub's 2 GiB asset limit. The .sha256 file lists the
          # whole tar and each part; check what is present, then the reassembled tar.
          shopt -s nullglob
          source_assets=()
          for checksum in ./*-sources.tar.sha256; do
            tar_name="$(basename "$checksum" .sha256)"
            [[ -e "$tar_name" || -e "$tar_name.part000" ]] || { echo "Missing $tar_name" >&2; exit 1; }
            sha256sum -c --ignore-missing "$checksum"
            parts=("$tar_name".part*)
            if (( ${#parts[@]} )); then
              whole="$(awk -v n="$tar_name" '$2 == n {print $1}' "$checksum")"
              [[ "$(cat "${parts[@]}" | sha256sum | cut -d' ' -f1)" == "$whole" ]] \
                || { echo "Reassembled $tar_name does not match its checksum" >&2; exit 1; }
              source_assets+=("${parts[@]}")
            else
              source_assets+=("$tar_name")
            fi
            source_assets+=("$checksum")
          done
          (( ${#source_assets[@]} )) || { echo 'No corresponding-source archive was built' >&2; exit 1; }
          shopt -u nullglob
          title="Offline install package · KRaft $VERSION"
          [[ "$EDITION" != epc ]] || title="Offline install package · EPC $VERSION"
          cat > release-notes.md <<NOTES
          Offline install package for the $EDITION edition (not broker images), built by the package release workflow from \`${SOURCE_SHA:0:7}\`.

          Includes the brokers, Kafbat UI with shared login and SSO, Keycloak and PostgreSQL (optional \`sso\` profile) and monitoring. Download the package for your VM's processor and follow its install steps below.

          SSO setup guides are in \`docs/\` inside the package; start with \`docs/dual-login.md\`. SSO needs Docker Compose 2.20.2 or newer and a site acceptance test against your identity provider.

          ## Packages

          NOTES
          cat ./*.notes.md >> release-notes.md
          cat >> release-notes.md <<'NOTES'
          ## Corresponding source

          Each package has a `-sources.tar` asset with the corresponding source of the GPL, LGPL, MPL, EPL and other copyleft components in its container images, hash-verified against their upstream publishers, with `SOURCES.md` and `manifest.json` inside. A source archive larger than 2 GiB is attached as `.partNNN` pieces: `cat <name>-sources.tar.part* > <name>-sources.tar`, then `sha256sum -c --ignore-missing <name>-sources.tar.sha256`. See LICENSE-SOURCES.md in the repository.
          NOTES
          assets=(./*.tar.gz ./*.tar.gz.sha256 ./*.images.lock.tsv "${source_assets[@]}")

          # Restartable: reuse a tag already on this commit, and fill a draft
          # release that is published only after every asset is uploaded.
          tag_sha="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha")"
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA"
          elif [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $tag_sha, not $SOURCE_SHA" >&2
            exit 1
          fi
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "$draft" in
            "")
              gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
                --title "$title" --notes-file release-notes.md ;;
            true)
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
              gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md ;;
            *)
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1 ;;
          esac
          # KRaft is the default edition: its highest package version is the
          # repository's Latest release. EPC and broker image releases never are.
          latest=false
          if [[ "$EDITION" == kraft ]]; then
            newest="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/package-kraft-v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | sort -V | tail -1)"
            [[ "$newest" != "$RELEASE_TAG" ]] || latest=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
