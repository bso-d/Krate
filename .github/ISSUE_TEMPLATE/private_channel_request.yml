name: Request Private Reporting Channel
description: Request a confidential channel for security or Code of Conduct disclosures (no incident details).
title: "[Confidential]: Request for private communication channel"
labels: ["security", "confidential"]
body:
  - type: markdown
    attributes:
      value: |
        ### Request a Private Reporting Channel

        Use this form **only** when GitHub Private Vulnerability Reporting is unavailable and you need maintainers to establish a private, confidential communication channel (for sensitive security vulnerabilities or Code of Conduct concerns).

        > **CRITICAL SECURITY NOTICE**:
        > **DO NOT include any vulnerability details, reproduction steps, error logs, incident specifics, or names in this issue.**
        > This issue is publicly visible. Maintainers will establish a secure private channel with you to receive the report.

  - type: textarea
    id: contact_preference
    attributes:
      label: Preferred Contact Method (Optional)
      description: If you have a preferred secure contact method (e.g., GPG key ID, secure email), specify it here. Otherwise, maintainers will follow up via your GitHub profile.
      placeholder: "e.g., Please reach out via email / GPG / private communication."
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: "I confirm that I have NOT included any incident details, vulnerability descriptions, credentials, private keys, or system specifics in this public issue."
          required: true
