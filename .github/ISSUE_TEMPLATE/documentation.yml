name: Documentation Issue
description: Report an issue, gap, or suggested improvement in Krate documentation or guides.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: doc_target
    attributes:
      label: Affected Document or Guide
      description: Which document or guide needs attention?
      options:
        - "README.md"
        - "CONTRIBUTING.md"
        - "sso/guides/ (Keycloak, PingFederate, Grafana, Identity Gate)"
        - "monitoring/ (Fluent Bit, Perses, Grafana)"
        - "kafbat-ui/README.md"
        - "Architecture or Edition documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: Description of the Documentation Gap or Error
      description: What is inaccurate, outdated, confusing, or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: What should the documentation say instead? Please provide proposed wording or steps.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Relevant links, CLI outputs, or screenshots.
    validations:
      required: false
